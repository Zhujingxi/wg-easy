name: Check
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake clang pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libegl1-mesa-dev libgbm-dev libfontconfig1-dev libvulkan-dev libpipewire-0.3-dev libclang-dev libasound2-dev xvfb xauth mesa-vulkan-drivers fonts-noto-cjk
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - name: Native desktop acceptance with software Vulkan
        shell: bash
        if: runner.os == 'Linux'
        run: |
          mkdir -p measurements/gui
          export WGE_PREVIEW_DIR="$PWD/measurements/gui"
          export WGE_PREVIEW_HEADLESS=1
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_DRIVER_FILES"
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s '-screen 0 1280x900x24' cargo test -p wge-gui --test desktop-preview --locked 2>&1 | tee measurements/gui/acceptance.log
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: desktop-acceptance-${{ github.sha }}
          path: measurements/gui/
          if-no-files-found: warn
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check build-tool prerequisites
        run: |
          command -v curl
          command -v jq
          command -v tar
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny check
      - run: cargo audit
  network:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Prepare isolated network tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dbus systemd-resolved
          sudo modprobe tun
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build native namespace tests
        run: cargo test -p wge-engine -p wge-platform --release --no-run --locked
      - name: Encrypted IPv4/IPv6, leak prevention and crash recovery
        run: |
          test -c /dev/net/tun || { echo '::error::The hosted runner needs /dev/net/tun for isolated tunnel tests.'; exit 1; }
          mkdir -p measurements
          export WGE_HOST_NETNS="$(readlink /proc/self/ns/net)"
          export WGE_HOST_MNTNS="$(readlink /proc/self/ns/mnt)"
          export WGE_METRICS_PATH="$PWD/measurements/tunnel-linux.json"
          unshare --user --map-root-user --mount --net cargo test -p wge-engine -p wge-platform --release --locked -- namespace_ --ignored --nocapture --test-threads=1
      - name: Real resolver DNS selection and recovery in private namespaces
        run: ./scripts/test-resolved.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tunnel-measurements-${{ github.sha }}
          path: measurements/
          if-no-files-found: error
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Check build-tool prerequisites
        run: |
          command -v curl
          command -v jq
          command -v tar
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - run: cargo fuzz run parse --target x86_64-unknown-linux-gnu -- -max_total_time=60 -max_len=1048576
