[package]
name = "wge-gui"
description = "Desktop app: tunnel list, add-tunnel screen and tray"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "wg-easy"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
wge-config.workspace = true
wge-ipc.workspace = true
gpui-kit = "=0.7.2"
rust-i18n = "4.2"
tokio.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
rqrr = "0.11"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
xcap = "0.9"
directories = "6"
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.21", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[[test]]
name = "desktop-preview"
path = "tests/desktop_preview.rs"
harness = false
test = false
