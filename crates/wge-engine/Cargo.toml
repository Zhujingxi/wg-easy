[package]
name = "wge-engine"
description = "Userspace WireGuard tunnel engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
wge-config.workspace = true

gotatun.workspace = true
thiserror.workspace = true
tokio.workspace = true
tun.workspace = true
wge-platform.workspace = true
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
fastrand = "2"

[dev-dependencies]
netconfig = "0.4"
tempfile = "3"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
netlink-sys = "0.8"
rustix = { version = "1", features = ["mount"] }
