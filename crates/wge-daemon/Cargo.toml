[package]
name = "wge-daemon"
description = "Privileged service that owns the tunnels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "wg-easy-daemon"
path = "src/main.rs"

[dependencies]
wge-config.workspace = true
wge-engine.workspace = true
wge-ipc.workspace = true
wge-platform.workspace = true

anyhow.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
getrandom = "0.3"
tokio = { workspace = true, features = ["sync", "io-util"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"
