[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
wge-config = { path = "crates/wge-config" }
wge-engine = { path = "crates/wge-engine" }
wge-ipc = { path = "crates/wge-ipc" }
wge-platform = { path = "crates/wge-platform" }

anyhow = "1"
base64 = "0.22"
gotatun = { version = "0.9.2", features = ["device", "tun"] }
ipnetwork = "0.21"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tun = { version = "0.8", default-features = false, features = ["async"] }

[profile.release]
lto = "thin"
codegen-units = 1
